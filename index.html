<!DOCTYPE html>

      padding: 20px;
      font-size: 26px;
      font-weight: bold;

      display: grid;

      padding: 20px;

    .item {
      background: white;
      border-radius: 15px;
      padding: 10px;

    }

    .item img {
      width: 100%;
      border-radius: 10px;
      transition: 0.3s;
    }

    .item img:hover {
      transform: scale(1.05);
    }

    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      background: #ff69b4;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
    }

    .btn:hover {
      background: #ff1493;
    }

    footer {
      font-size: 12px;
      padding: 15px;
      color: #555;
    }
  </style>
</head>

<!DOCTYPE html>
<html>
<head>
  <title>Nails by Kylie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 0;
      background: #fff0f5;
      text-align: center;
    }

    header {
      background: #ff69b4;
      color: white;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: inline-block;
      width: 250px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #ff69b4;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 30px;
      padding: 15px;
      background: #ff69b4;
      color: white;
    }
  </style>
</head>

<body>

<header>
  Nails by Kylie 💅
</header>

<div class="container">
  <p>Welcome to Nails by Kylie 💅✨  
  Your go-to place for cute, classy, and trending nail designs.</p>

  <div class="card">
    <img src="https://via.placeholder.com/250" alt="Nails">
    <h3>Simple Nails</h3>
    <a href="#" class="btn">View Ideas</a>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/250" alt="Nails">
    <h3>Acrylic Nails</h3>
    <a href="#" class="btn">View Ideas</a>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/250" alt="Nails">
    <h3>Trending Designs</h3>
    <a href="#" class="btn">View Ideas</a>
  </div>

</div>

<footer>
  © 2026 Nails by Kylie | Book your appointment soon 💖
</footer>

</body>
</html>

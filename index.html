<!DOCTYPE html>

  <style>
    body {

      margin: 0;
      padding: 0;
      background: #fff0f5;
      text-align: center;
    }

    header {
      background: #ff69b4;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    p {
      padding: 10px;
      font-size: 16px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card h3 {
      font-size: 16px;
      margin: 10px 0;
    }

    button {
      background: #ff69b4;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #ff1493;
    }
  </style>
</head>
